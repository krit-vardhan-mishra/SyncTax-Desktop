name: Build & Release

on:
  # Automatically trigger on version tags (e.g., v4.0.0-alpha.4) and master/main pushes
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v4.0.0-alpha.5). Leave empty to use the current commit SHA.'
        required: false
        type: string
      release_title:
        description: 'Release title (e.g., SyncTax Desktop v4.0.0-alpha.5 — What Changed!)'
        required: false
        type: string
      release_body:
        description: 'Release notes body (Markdown supported). Leave empty for auto-generated notes.'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Mark as draft?'
        required: false
        default: true
        type: boolean

# Ensure only one release workflow runs at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_VITE_LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
  MAIN_VITE_GENIUS_API_KEY: ${{ secrets.GENIUS_API_KEY }}
  MAIN_VITE_LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
  MAIN_VITE_ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
  MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Build on each platform and upload artifacts
  # ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            platform: win
            build_script: build:win
          # ── Linux ──
          - os: ubuntu-latest
            platform: linux
            build_script: build:linux
          # ── macOS ──
          - os: macos-latest
            platform: mac
            build_script: build:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Update package.json version from tag/input
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          elif [[ -n "$INPUT_TAG_NAME" ]]; then
            TAG="$INPUT_TAG_NAME"
          else
            TAG=""
          fi
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "Updating package.json version to $VERSION"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
            "
          else
            echo "No tag or input tag name provided, keeping version in package.json"
          fi

      - name: Install dependencies
        run: |
          npm ci --no-fund --no-audit --include=optional
          npm rebuild rollup

      # Linux needs additional packages for electron-builder
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo snap install snapcraft --classic

      - name: Build for ${{ matrix.platform }}
        run: npm run ${{ matrix.build_script }}

      # Upload dist/ as a workflow artifact so the release job can download it
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
          retention-days: 3

  # ─────────────────────────────────────────────────────────
  # Job 2: Create a single GitHub Release and upload all assets
  # ─────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    # Only run the release job if triggered by a tag or manual dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download all build artifacts from the matrix jobs
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-win
          path: release-assets/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: release-assets/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-mac
          path: release-assets/

      # Debug: list all assets
      - name: List release assets
        run: |
          echo "=== Release Assets ==="
          find release-assets/ -type f | sort
          echo "======================"

      # Determine version, tag, draft, and prerelease options
      - name: Determine release tag and version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          elif [[ -n "$INPUT_TAG_NAME" ]]; then
            TAG="$INPUT_TAG_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          
          # Determine draft status
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            DRAFT="$INPUT_DRAFT"
          else
            DRAFT="false"
          fi
          
          # Determine prerelease status
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PRERELEASE="$INPUT_PRERELEASE"
          else
            # On tag pushes, automatically mark as pre-release if tag contains a hyphen
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (version: $VERSION, draft: $DRAFT, prerelease: $PRERELEASE)"

      # Build the release title
      - name: Determine release title
        id: title
        run: |
          if [[ -n "${{ inputs.release_title }}" ]]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="SyncTax Desktop ${{ steps.version.outputs.tag }}"
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      # Build the release body with all details
      - name: Generate release body
        id: body
        run: |
          if [[ -n "${{ inputs.release_body }}" ]]; then
            echo "${{ inputs.release_body }}" > release_body.md
          else
            cat > release_body.md << 'RELEASE_EOF'
          ## SyncTax Desktop ${{ steps.version.outputs.tag }}

          An elegant, hybrid music player for the desktop. Built on top of a modernized architecture with Electron + React + TypeScript.

          ---

          ### 📦 Downloads

          #### Windows
          | File | Architecture | Description |
          |------|-------------|-------------|
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-win-x64.exe` | x64 (Intel/AMD) | Windows installer (64-bit) |
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-win-arm64.exe` | ARM64 | Windows installer (ARM) |

          #### macOS
          | File | Architecture | Description |
          |------|-------------|-------------|
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-mac-x64.dmg` | x64 (Intel) | macOS disk image (Intel Macs) |
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-mac-arm64.dmg` | ARM64 (Apple Silicon) | macOS disk image (M1/M2/M3+) |

          #### Linux
          | File | Description |
          |------|-------------|
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-linux-x86_64.AppImage` | AppImage (universal, no install needed) |
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-linux-amd64.deb` | Debian/Ubuntu package |
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-linux-x86_64.rpm` | Fedora/RHEL package |
          | `SyncTax.Desktop.v${{ steps.version.outputs.version }}-linux-amd64.snap` | Snap package |

          ---

          ### 🚀 Installation

          **Windows:**
          1. Download the `.exe` installer for your architecture (x64 or arm64).
          2. Run the installer and follow the setup wizard.
          3. Launch SyncTax Desktop and select your music directory!

          **macOS:**
          1. Download the `.dmg` file for your Mac (Intel x64 or Apple Silicon arm64).
          2. Open the `.dmg` and drag **SyncTax Desktop** into your Applications folder.
          3. On first launch, right-click → Open to bypass Gatekeeper (unsigned app).

          **Linux (AppImage):**
          1. Download the `.AppImage` file.
          2. Make it executable: `chmod +x SyncTax*.AppImage`
          3. Run it: `./SyncTax*.AppImage`

          **Linux (Debian/Ubuntu):**
          ```bash
          sudo dpkg -i SyncTax*.deb
          ```

          **Linux (Fedora/RHEL):**
          ```bash
          sudo rpm -i SyncTax*.rpm
          ```

          ---

          ### 🛠️ Tech Stack
          - Built with **Electron** + **React** + **TypeScript**
          - Maintained by [Krit Vardhan Mishra](https://github.com/krit-vardhan-mishra)
          RELEASE_EOF
          fi
          echo "Generated release body."

      # Create the GitHub Release and upload all assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.title.outputs.title }}
          body_path: release_body.md
          draft: ${{ steps.version.outputs.draft == 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.snap
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
            release-assets/*.yml
            release-assets/*.yaml
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
